name: Create Plugin Beta Release

on:
    push:
        # Keep these typed branch globs in sync with docs/release-path.md.
        branches:
            - "feature/**"
            - "feature-*"
            - "feat/**"
            - "feat-*"
            - "fix/**"
            - "fix-*"
            - "bug/**"
            - "bug-*"
            - "bugfix/**"
            - "bugfix-*"
            - "hotfix/**"
            - "hotfix-*"
            - "chore/**"
            - "chore-*"
            - "deps/**"
            - "deps-*"
            - "docs/**"
            - "docs-*"
            - "refactor/**"
            - "refactor-*"
            - "perf/**"
            - "perf-*"
            - "test/**"
            - "test-*"
            - "tests/**"
            - "tests-*"
            - "ci/**"
            - "ci-*"
            - "build/**"
            - "build-*"
            - "style/**"
            - "style-*"
            - "breaking/**"
            - "breaking-*"
            - "major/**"
            - "major-*"

concurrency:
    group: beta-release
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write
    attestations: write
    actions: write

env:
    PLUGIN_NAME: obsidian-git

jobs:
    prepare:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            version: ${{ steps.beta-version.outputs.new_tag }}
            source_sha: ${{ github.sha }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - uses: pnpm/action-setup@v6
              with:
                  version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install
              run: pnpm install

            - name: Compute beta SemVer
              id: beta-version
              env:
                  RELEASE_BRANCH: ${{ github.ref_name }}
              run: |
                  git fetch --tags --force
                  pnpm exec tsx scripts/compute-beta-version.ts

            - name: Refuse to overwrite an existing release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.beta-version.outputs.new_tag }}
              run: |
                  set -euo pipefail
                  if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                      echo "::error::release ${TAG} already exists"
                      exit 1
                  fi

    build:
        needs: prepare
        uses: ./.github/workflows/plugin-build.yml
        with:
            version: ${{ needs.prepare.outputs.version }}
            sha: ${{ needs.prepare.outputs.source_sha }}

    publish:
        needs: [prepare, build]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: plugin-dist
                  path: dist

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
                      dist/${{ env.PLUGIN_NAME }}-${{ needs.prepare.outputs.version }}.zip

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                  prerelease: true
                  tag_name: ${{ needs.prepare.outputs.version }}
                  name: Beta ${{ needs.prepare.outputs.version }}
                  target_commitish: ${{ github.ref_name }}
                  fail_on_unmatched_files: true
                  files: |
                      dist/${{ env.PLUGIN_NAME }}-${{ needs.prepare.outputs.version }}.zip
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
